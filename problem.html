<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogiQuest Problem</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>LogiQuest</h1>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>

        <section id="problem-intro">
            <p>Number Theory · Start Here</p>

            <h2 id="problem-title">
                Problem 1
            </h2>

            <p id="problem-source">
                Source: CEMC Gauss Contest
            </p>
        </section>


        <section id="problem-section">
            <h3>Problem</h3>

            <div id="problem-text">
                <p>
                    The problem will appear here.
                </p>
            </div>

            <button id="start-button">
                Start Thinking
            </button>
        </section>


        <section id="learning-section">

            <div id="learning-content">
                <p>
                    Your guided reasoning will appear here.
                </p>
            </div>
        </section>

    </main>

<script>
    const params = new URLSearchParams(window.location.search);
    const problemId = params.get("id") || "002";

    const dataScript = document.createElement("script");
    dataScript.src = `data/problem-${problemId}.js`;

    dataScript.onload = function () {
    
    const engineScript = document.createElement("script");
    engineScript.src = "js/checkpoint-engine.js";

    document.body.appendChild(engineScript);
    };

    dataScript.onerror = function () {
        document.getElementById("learning-content").innerHTML = `
            <p>
                Problem ${problemId} could not be loaded.
            </p>
        `;
    };

    document.body.appendChild(dataScript);
</script>
</body>

</html>
